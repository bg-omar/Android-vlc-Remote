// settings.gradle

pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

// All other statements must come after pluginManagement.
dependencyResolutionManagement {
  // Allow project repositories (needed for flatDir) while preferring settings-defined ones
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    google()
    mavenCentral()
  }
}
rootProject.name = "Android-vlc-Remote"
include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new java.io.File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
