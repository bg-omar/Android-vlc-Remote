<ion-header class="ion-no-border" [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list inset>
    <ion-item>
      <ion-input type="text"
                 [helperText]="'Password of VLC preferences: All Settings - Main Interfaces - Lua http'"
                 [placeholder]="'your vlc password'"
                 [(ngModel)]="vlcPass">
      </ion-input>
      <ion-button class="butt" (click)="getPass(1)">show</ion-button>
      <ion-button class="butt" (click)="getPass(2)">set</ion-button>
    </ion-item>
  </ion-list>
  <ion-list inset *ngFor="let item of getterdata; index as i">
    <ion-item>
      <ion-badge color="tertiary">
        {{item.ipAddress}}
      </ion-badge>
      <ion-button class="butt" (click)="delJson(i)">remove</ion-button>
      <ion-button class="butt" (click)="setHide(i)">{{item.hide ? 'show' : 'hide'}}</ion-button>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Add an other VLC</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-list>
          <ion-item>
            <ion-item  *ngIf="!useLocalhost">
              <ion-input type="number" class="ip-seg" [(ngModel)]="segment1" maxlength="3" inputmode="numeric" pattern="^[0-9]{1,3}$" (ionInput)="enforceOctet('segment1', $event.target.value)"/>.
              <ion-input type="number" class="ip-seg" [(ngModel)]="segment2" maxlength="3" inputmode="numeric" pattern="^[0-9]{1,3}$" (ionInput)="enforceOctet('segment2', $event.target.value)"/>.
              <ion-input type="number" class="ip-seg" [(ngModel)]="segment3" maxlength="3" inputmode="numeric" pattern="^[0-9]{1,3}$" (ionInput)="enforceOctet('segment3', $event.target.value)"/>.
              <ion-input type="number" class="ip-seg" [(ngModel)]="segment4" maxlength="3" inputmode="numeric" pattern="^[0-9]{1,3}$" (ionInput)="enforceOctet('segment4', $event.target.value)"/>
            </ion-item>
            <ion-item  *ngIf="useLocalhost">
              <ion-input type="text"
                         class="custom-seg"
                         [placeholder]="'http://localhost'"
                         label="Custom ip address....." labelPlacement="stacked"
                         [(ngModel)]="configForm.ipAddress">

              </ion-input>
            </ion-item>
            :<ion-input type="number"  class="ip-seg" [(ngModel)]="port" maxlength="5" inputmode="numeric" pattern="^[0-9]{1,5}$" (ionInput)="enforcePort($event.target.value)"/>
          </ion-item>

          <ion-item lines="none">
            <ion-note color="medium">Preview: {{ builtPreview() }}</ion-note>
          </ion-item>
          <ion-item lines="none">
            <ion-button (click)="setLocalhost()" (keydown.enter)="setLocalhost()">{{ useLocalhost ? "Use IP" : "Use localhost" }}</ion-button>
            <ion-button class="butt" [disabled]="!(validateLastOctet() && validatePort())" (click)="setJson(1)" (keydown.enter)="setJson(1)">Add</ion-button>
          </ion-item>
        </ion-list>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
