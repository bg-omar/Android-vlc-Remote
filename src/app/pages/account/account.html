<ion-header class="ion-no-border" [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list inset>
    <ion-item>
      <ion-input type="text"
                 [helperText]="'Password of VLC preferences: All Settings - Main Interfaces - Lua http'"
                 [placeholder]="'your vlc password'"
                 [(ngModel)]="vlcPass">
      </ion-input>
      <ion-button class="butt" (click)="getPass(1)">show</ion-button>
      <ion-button class="butt" (click)="getPass(2)">set</ion-button>
    </ion-item>
  </ion-list>
  <ion-list inset *ngFor="let item of getterdata; index as i">
    <ion-item>
      <ion-badge color="tertiary">
        {{item.ipAddress}}
      </ion-badge>
      <ion-button class="butt" (click)="delJson(i)">remove</ion-button>
      <ion-button class="butt" (click)="setHide(i)">{{item.hide ? 'show' : 'hide'}}</ion-button>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Add an other VLC</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-list>
          <ion-item>
            <ion-button (click)="setLocalhost()">Use localhost</ion-button>
            <ion-item  *ngIf="!useLocalhost">
              <ion-input type="number" label="Segment 1" labelPlacement="stacked"  [(ngModel)]="segment1"/>.
              <ion-input type="number" label="Segment 2" labelPlacement="stacked"  [(ngModel)]="segment2"/>.
              <ion-input type="number" label="Segment 3" labelPlacement="stacked"  [(ngModel)]="segment3"/>.
              <ion-input type="number" label="Segment 4" labelPlacement="stacked"  [(ngModel)]="segment4"/>
            </ion-item>
            <ion-item  *ngIf="useLocalhost">
              <ion-input type="text"
                         [placeholder]="'http://localhost'"
                         label="Custom ip address" labelPlacement="stacked"
                         [(ngModel)]="configForm.ipAddress">

              </ion-input>
            </ion-item>
            :<ion-input type="number" [(ngModel)]="port"/>

            <ion-button class="butt" (click)="setJson(1)">Add</ion-button>
          </ion-item>

          <ion-item lines="none">
            <ion-note color="medium">Preview: {{ builtPreview() }}</ion-note>
          </ion-item>
          <ion-item lines="none">
            <ion-button class="butt" [disabled]="!validateLastOctet() || !validatePort()" (click)="setJson(1)">Add</ion-button>
          </ion-item>
        </ion-list>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
